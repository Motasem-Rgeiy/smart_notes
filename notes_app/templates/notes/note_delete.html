{% extends "base.html" %}

{% block content %}

<div class="grow flex justify-center items-center">
    <div class="flex flex-col bg-slate-900 w-1/3 h-64 justify-between p-3 rounded-xl">
        <h1 class="text-xl tracking-wider">Are you sure ?</h1>
        <i class="fa-solid fa-triangle-exclamation self-center text-4xl"></i>
        <form  method="POST">
            {% csrf_token %}
            <div class="flex justify-center gap-8">
                <button class="flex items-center gap-1 text-2xl bg-red-600 px-4 py-2 rounded-lg cursor-pointer" type="submit">
                    <i class="fa-solid fa-delete-left"></i>
                    <span>Delete</span>
                </button>

                <a class="flex items-center gap-1 text-2xl" href="{% url "note_list" %}">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>Cancel</span>
                <a>

            </div>
        </form>
    </div>

</div>


{% endblock  %}
