{% extends "base.html" %}

{% block content %}

<div class="grow flex flex-col justify-center items-center">
   <div class="bg-slate-900 flex flex-col  rounded-lg p-4  min-w-xl">
        <div class="flex items-center justify-center text-xl border-b-2 w-full">
            <i class="fa-solid fa-circle-user"></i>
            <h1 class=" p-4  font-bold tracking-widest text-center">Settings</h1>
        </div>
        <form class="p-4 flex flex-col gap-4"  action="{% url "profile" %}" method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="flex flex-col gap-2">
                <label class="tracking-widest font-semibold" for="">First Name</label>
                {{ form.first_name }}
            </div>

            <div class="flex flex-col gap-2">
                <label class="tracking-widest font-semibold" for="">Last Name</label>
                {{form.last_name}}
            </div>

            


            <div class="flex flex-col gap-2">
                <label class="tracking-widest font-semibold" for="">Email</label>
                {{form.email}}
            </div>

            <div class="flex flex-col gap-2">
                <label class="tracking-widest font-semibold" for="">Image</label>
                {{form.image}}
            </div>
            {% if request.user.image %}
                <img class="w-44 h-44 m-auto rounded-lg mix-blend-screen" src="{{request.user.image.url}}" alt="">
            {% endif %}





            <button class="bg-slate-950 cursor-pointer flex items-center justify-center gap-2 w-fit m-auto py-3 px-7 rounded-lg hover:bg-green-600 hover:transition hover:duration-500 focus:outline-1" type="submit">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Change</span>
            </button>
        </form>
    </div>

</div>
{% endblock  %}
